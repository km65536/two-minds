# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: two-minds
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false # ダッシュボードで入力する（リポジトリには書かない）
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_ENABLED
        value: "true"
      - key: DAILY_CALL_LIMIT
        value: "300"
      - key: RPM_LIMIT
        value: "10"
      - key: IP_DAILY_LIMIT
        value: "120"
      - key: IP_RPM_LIMIT
        value: "8"
